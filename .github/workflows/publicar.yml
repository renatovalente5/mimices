# Constrói o site da Mimices e publica a PRÉ-VISUALIZAÇÃO no GitHub Pages:
# https://renatovalente5.github.io/mimices/ (construída com --base=/mimices, fechada aos motores
# de busca; o robots.txt deixa entrar só os robôs que fazem a pré-visualização das ligações no
# WhatsApp e no Facebook).
#
# É provisório: os termos do Pages não deixam lá uma loja. Quando o Renato comprar mimices.pt, o
# site passa para a Cloudflare (o Worker «mimices-site», wrangler.jsonc), como a Pokóto Wood a 11 out
# 2026, com `node scripts/build.mjs --producao` — que RECUSA publicar enquanto faltar um dado legal
# (NIF, morada, prazos, IVA, portes) ou o preço e a composição de um artigo.
#
# Os nomes dos passos são em português: o painel vai mostrá-los à dona quando uma publicação parar.
name: Publicar o site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Todos os dias às 00:15 de Lisboa (23:15 UTC no inverno): as promoções e o aviso do topo
  # têm data de fim, e o site só muda quando se publica.
  schedule:
    - cron: '15 23 * * *'

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # a data de cada página no sitemap sai do histórico do git
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Instalar o Pillow
        run: python -m pip install --disable-pip-version-check 'pillow==11.3.0'
      - name: Guardar as imagens entre publicações
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/imagens
          key: imagens-${{ hashFiles('media/**', 'scripts/imagens.py', 'content/produtos/*.json') }}
          restore-keys: imagens-
      - name: Conferir as fotografias
        run: python scripts/imagens.py --verificar
      - name: Construir (pré-visualização)
        run: node scripts/build.mjs --base=/mimices
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
